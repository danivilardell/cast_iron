[project]
name = "ctc"
version = "0.1.0"
description = "Covert Timestamped Commitments (CTCs) for coercion-resistant voter self-registration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ecdsa>=0.19",
    "tronpy[offline]>=0.5",
    "python-dotenv>=1",
    "eth-hash[pycryptodome]",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
